[project]
name = "spilled-energy"
version = "0.1.0"
description = "Energy-based Hallucination detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.1.0",
    "bitsandbytes>=0.46.1",
    "datasets>=4.0.0",
    "dotenv>=0.9.0",
    "matplotlib>=3.10.8",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "torch>=2.8.0",
    "transformers>=5.0.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# --- Reproduction note (added by sophQFT) ---
# Original uv.lock resolved torch to a CUDA 13 build (torch 2.12.1+cu130),
# which does not run on our driver (570.x / CUDA 12.8).
# Pin torch to PyTorch's CUDA 12.8 wheel index instead.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
